services:
  astech-explorer:
    build:
      context: .
    image: astech-explorer:latest
    container_name: astech-explorer
    ports:
      - "8099:8099"
    environment:
      PORT: "8099"
      # Connexion Oracle ASTECH (le mot de passe vient du fichier .env, jamais commité)
      ORACLE_ASTECH_HOST: "${ORACLE_ASTECH_HOST:-10.103.130.25}"
      ORACLE_ASTECH_PORT: "${ORACLE_ASTECH_PORT:-1523}"
      ORACLE_ASTECH_SERVICE: "${ORACLE_ASTECH_SERVICE:-PIVRY01}"
      ORACLE_ASTECH_USER: "${ORACLE_ASTECH_USER:-ASTECHIVR}"
      ORACLE_ASTECH_PASSWORD: "${ORACLE_ASTECH_PASSWORD:-}"
      # Base de TEST / recette (optionnelle). Renseigne-t-on les mêmes suffixes
      # que la prod : ORACLE_ASTECH_TEST_HOST/PORT/SERVICE/USER/PASSWORD.
      ORACLE_ASTECH_TEST_HOST: "${ORACLE_ASTECH_TEST_HOST:-}"
      ORACLE_ASTECH_TEST_PORT: "${ORACLE_ASTECH_TEST_PORT:-1521}"
      ORACLE_ASTECH_TEST_SERVICE: "${ORACLE_ASTECH_TEST_SERVICE:-}"
      ORACLE_ASTECH_TEST_USER: "${ORACLE_ASTECH_TEST_USER:-}"
      ORACLE_ASTECH_TEST_PASSWORD: "${ORACLE_ASTECH_TEST_PASSWORD:-}"
      # Profil sélectionné par défaut au démarrage : prod ou test.
      ASTECH_ENV: "${ASTECH_ENV:-prod}"
      # Écritures (pousser les indices) : désactivées par défaut.
      ASTECH_ALLOW_WRITES: "${ASTECH_ALLOW_WRITES:-0}"
      # Journal des écritures d'indices (persisté via le volume).
      ASTECH_JOURNAL_FILE: "/app/data/indices-journal.jsonl"
      # Source Studio-RH (optionnelle). Laisser vide tant que non fournie.
      STUDIO_RH_API_URL: "${STUDIO_RH_API_URL:-}"
      STUDIO_RH_API_KEY: "${STUDIO_RH_API_KEY:-}"
      STUDIO_RH_INSECURE_TLS: "${STUDIO_RH_INSECURE_TLS:-}"
      # Authentification AD (APM de la Ville) + session applicative.
      # Sans ces variables, le conteneur ne peut PAS imposer la connexion.
      APM_API_URL: "${APM_API_URL:-}"
      APM_API_KEY: "${APM_API_KEY:-}"
      APM_INSECURE_TLS: "${APM_INSECURE_TLS:-}"
      # 1 = impose la connexion AD pour accéder à l'application.
      ASTECH_REQUIRE_AUTH: "${ASTECH_REQUIRE_AUTH:-0}"
      ASTECH_AGENT_ALLOW: "${ASTECH_AGENT_ALLOW:-}"
      ASTECH_AGENT_DENY: "${ASTECH_AGENT_DENY:-}"
      ASTECH_ADMIN_USERS: "${ASTECH_ADMIN_USERS:-}"
      ASTECH_SESSION_SECRET: "${ASTECH_SESSION_SECRET:-}"
      ASTECH_SESSION_TTL_MS: "${ASTECH_SESSION_TTL_MS:-}"
      ASTECH_LOCAL_ADMIN_LOGIN: "${ASTECH_LOCAL_ADMIN_LOGIN:-}"
      ASTECH_LOCAL_ADMIN_PASSWORD_HASH: "${ASTECH_LOCAL_ADMIN_PASSWORD_HASH:-}"
      # API référentiels en lecture seule — clés au format "nom:cle,nom2:cle2"
      # (durables : reprises à chaque redémarrage même après reconstruction).
      # La gestion des clés (/api/admin/keys) est ouverte à l'UI locale, sans jeton.
      ASTECH_API_KEYS: "${ASTECH_API_KEYS:-}"
      # Fichier des clés générées dynamiquement (persisté via le volume).
      ASTECH_KEYS_FILE: "/app/data/api-keys.json"
      # API Explorer : cibles externes (interface OPUS ↔ NEOCITY).
      ASTECH_API_URL: "${ASTECH_API_URL:-}"
      ASTECH_API_USER: "${ASTECH_API_USER:-}"
      ASTECH_API_PASSWORD: "${ASTECH_API_PASSWORD:-}"
      ASTECH_API_AUTH: "${ASTECH_API_AUTH:-}"
      ASTECH_API_TOKEN: "${ASTECH_API_TOKEN:-}"
      ASTECH_API_TOKEN_URL: "${ASTECH_API_TOKEN_URL:-}"
      ASTECH_API_CLIENT_ID: "${ASTECH_API_CLIENT_ID:-}"
      ASTECH_API_CLIENT_SECRET: "${ASTECH_API_CLIENT_SECRET:-}"
      NEOCITY_API_URL: "${NEOCITY_API_URL:-}"
      NEOCITY_API_USER: "${NEOCITY_API_USER:-}"
      NEOCITY_API_PASSWORD: "${NEOCITY_API_PASSWORD:-}"
      NEOCITY_API_AUTH: "${NEOCITY_API_AUTH:-}"
      NEOCITY_API_TOKEN: "${NEOCITY_API_TOKEN:-}"
      NEOCITY_API_TOKEN_URL: "${NEOCITY_API_TOKEN_URL:-}"
      NEOCITY_API_CLIENT_ID: "${NEOCITY_API_CLIENT_ID:-}"
      NEOCITY_API_CLIENT_SECRET: "${NEOCITY_API_CLIENT_SECRET:-}"
    volumes:
      - astech-data:/app/data
    restart: unless-stopped

volumes:
  astech-data:

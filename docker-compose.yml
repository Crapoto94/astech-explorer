services:
  astech-explorer:
    build:
      context: .
    image: astech-explorer:latest
    container_name: astech-explorer
    ports:
      - "8099:8099"
    environment:
      PORT: "8099"
      # Connexion Oracle ASTECH (le mot de passe vient du fichier .env, jamais commité)
      ORACLE_ASTECH_HOST: "${ORACLE_ASTECH_HOST:-10.103.130.25}"
      ORACLE_ASTECH_PORT: "${ORACLE_ASTECH_PORT:-1523}"
      ORACLE_ASTECH_SERVICE: "${ORACLE_ASTECH_SERVICE:-PIVRY01}"
      ORACLE_ASTECH_USER: "${ORACLE_ASTECH_USER:-ASTECHIVR}"
      ORACLE_ASTECH_PASSWORD: "${ORACLE_ASTECH_PASSWORD}"
      # Base de TEST / recette (optionnelle). Renseigne-t-on les mêmes suffixes
      # que la prod : ORACLE_ASTECH_TEST_HOST/PORT/SERVICE/USER/PASSWORD.
      ORACLE_ASTECH_TEST_HOST: "${ORACLE_ASTECH_TEST_HOST:-}"
      ORACLE_ASTECH_TEST_PORT: "${ORACLE_ASTECH_TEST_PORT:-1521}"
      ORACLE_ASTECH_TEST_SERVICE: "${ORACLE_ASTECH_TEST_SERVICE:-}"
      ORACLE_ASTECH_TEST_USER: "${ORACLE_ASTECH_TEST_USER:-}"
      ORACLE_ASTECH_TEST_PASSWORD: "${ORACLE_ASTECH_TEST_PASSWORD:-}"
      # Profil sélectionné par défaut au démarrage : prod ou test.
      ASTECH_ENV: "${ASTECH_ENV:-prod}"
      # Écritures (pousser les indices) : désactivées par défaut.
      ASTECH_ALLOW_WRITES: "${ASTECH_ALLOW_WRITES:-0}"
      # Journal des écritures d'indices (persisté via le volume).
      ASTECH_JOURNAL_FILE: "/app/data/indices-journal.jsonl"
      # Source Studio-RH (optionnelle). Laisser vide tant que non fournie.
      STUDIO_RH_API_URL: "${STUDIO_RH_API_URL:-}"
      STUDIO_RH_API_KEY: "${STUDIO_RH_API_KEY:-}"
      # API référentiels en lecture seule — clés au format "nom:cle,nom2:cle2"
      # (durables : reprises à chaque redémarrage même après reconstruction).
      ASTECH_API_KEYS: "${ASTECH_API_KEYS:-}"
      # Jeton pour l'administration des clés (/api/admin/keys).
      ASTECH_ADMIN_TOKEN: "${ASTECH_ADMIN_TOKEN:-}"
      # Fichier des clés générées dynamiquement (persisté via le volume).
      ASTECH_KEYS_FILE: "/app/data/api-keys.json"
    volumes:
      - astech-data:/app/data
    restart: unless-stopped

volumes:
  astech-data:
